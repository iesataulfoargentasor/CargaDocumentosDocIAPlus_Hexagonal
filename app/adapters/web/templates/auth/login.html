{% extends 'base.html' %}{% block content %}<section class="card narrow"><p class="eyebrow">Acceso del profesorado</p><h1>Tu documentación,<br>en un solo lugar.</h1><p>Inicia sesión para incorporar y consultar programaciones.</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Usuario</label><input id="username" name="username" required maxlength="80" autocomplete="username"><label for="password">Contraseña</label><input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password"><button>Entrar</button></form></section>{% endblock %}
